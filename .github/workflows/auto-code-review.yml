name: Auto Code Review

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Prevent two review jobs running simultaneously
concurrency:
  group: auto-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review & Auto-fix
    runs-on: ubuntu-latest

    # Don't review PRs that the bot itself opens — avoids infinite loop
    if: ${{ !contains(github.head_ref, 'code-review/auto-fixes') }}

    permissions:
      contents: write # to push a fix branch (push mode)
      pull-requests: write # to open a PR (push mode) or post review comments (pr mode)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so we can diff against main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install review dependencies
        run: |
          pip install langchain-google-genai langchain-core python-dotenv

      - name: Run auto code reviewer
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TRIGGER_SHA: ${{ github.sha }}
          TRIGGER_REF: ${{ github.ref }}
          # Mode: "pr" on pull_request events, "push" on push events
          REVIEW_MODE: ${{ github.event_name == 'pull_request' && 'pr' || 'push' }}
          # PR-mode vars (empty on push, that's fine)
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/auto_review.py

      # Push mode only: open a PR if fixes were made
      - name: Open PR if fixes were made
        if: ${{ github.event_name == 'push' && hashFiles('.fix_branch_name') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=$(cat .fix_branch_name)
          git push origin "$BRANCH"
          gh pr create \
            --title "Auto Code Review: fixes on $(date +'%Y-%m-%d')" \
            --body-file .pr_body.md \
            --base main \
            --head "$BRANCH" \
            --label "code-review"
