name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        env:
          # Dummy key — all LLM calls are mocked, no real API requests
          GOOGLE_API_KEY: fake-key-for-testing
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          pytest tests/ -v --tb=short
